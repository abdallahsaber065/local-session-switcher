<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Local Session Switcher — small promo tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #0a0d0b;
        color: #efebdd;
        font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
      }
      .tile {
        box-sizing: border-box;
        width: 440px;
        height: 280px;
        padding: 28px 32px;
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0 27px,
            rgba(239, 235, 221, 0.04) 27px 28px
          ),
          #10140f;
        border: 2px solid #242b22;
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c5c4b0;
      }
      h1 {
        margin: 10px 0 8px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      p {
        margin: 0;
        max-width: 24rem;
        font-size: 15px;
        line-height: 1.45;
        color: #efebdd;
      }
      .stamp {
        display: inline-block;
        margin-top: 22px;
        padding: 4px 10px;
        border: 1px solid #55b183;
        color: #55b183;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="kicker">Chrome extension</div>
      <h1>Local Session Switcher</h1>
      <p>One click from admin to customer on localhost. Cookies and storage. Nothing leaves the machine.</p>
      <div class="stamp">MIT · local only</div>
    </div>
  </body>
</html>
