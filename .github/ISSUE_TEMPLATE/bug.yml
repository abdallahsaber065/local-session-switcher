name: Bug report
description: Something in the extension is broken
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please don't paste live session cookies, passwords, or tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load unpacked from …
        2. Project origins …
        3. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: '1.1.0 (or commit SHA)'
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Chromium
        - Brave
        - Edge
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Auth stack / extra hosts
      placeholder: NextAuth, Sanctum, Django, JWT, myapp.test, 192.168.x, …
